<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThePhoneSearch Seller Manager</title>
<style>
:root{--bg:#070b14;--panel:#0d1422;--line:#1f2b3d;--text:#f4f7fb;--muted:#8ea0b8;--blue:#4f8cff;--green:#38d996;--amber:#f7b955;--red:#ff6b78}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",sans-serif;background:#070b14;color:var(--text)}.topbar{height:78px;padding:0 3vw;display:flex;align-items:center;gap:25px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#070b14ee;z-index:20}.brand{font-size:20px;font-weight:900}.brand span{color:var(--blue)}nav{display:flex;gap:6px;flex:1;overflow:auto}button{font:inherit;cursor:pointer;border:0}.nav,.btn{padding:11px 14px;border-radius:10px;font-weight:700}.nav{background:transparent;color:var(--muted)}.nav:hover{background:#111b2c;color:white}.btn{background:#3979f6;color:#fff}.secondary{background:#182235;color:#dce6f5;border:1px solid var(--line)}.approve{background:#12382c;color:#67e6b0;border:1px solid #245b48}.skip{background:#332027;color:#ff9ba4;border:1px solid #60313a}.wrap{width:min(96vw,2400px);margin:auto;padding:35px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.hero h1{font-size:40px;margin:5px 0}.muted{color:var(--muted)}.eyebrow,.label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.metric,.panel,.listing{background:linear-gradient(145deg,#111a2b,#0b111d);border:1px solid var(--line);border-radius:16px}.metric{padding:18px}.value{font-size:24px;font-weight:850;margin-top:10px}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.panel{margin-top:16px;padding:24px}.notice{padding:14px 16px;border:1px solid #5a4621;background:#f7b95512;border-radius:12px;color:#ffd58b}.catalogFrame{width:100%;height:calc(100vh - 190px);min-height:760px;border:0;background:#fff}.productsPanel{padding:0;overflow:hidden;background:#fff}.productsPanel h2{display:none}.listingToolbar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:16px 0;flex-wrap:wrap}.listingGrid{display:grid;gap:16px}.listing{overflow:hidden}.listingHead{display:grid;grid-template-columns:100px 1fr auto;gap:18px;align-items:center;padding:18px;border-bottom:1px solid var(--line)}.thumb{width:90px;height:90px;object-fit:contain;background:white;border-radius:11px}.listingTitle{font-size:17px;font-weight:800}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.chip{padding:5px 8px;border:1px solid #29374d;border-radius:999px;color:#aebdd1;font-size:11px}.listingBody{display:grid;grid-template-columns:1fr 1.2fr;gap:16px;padding:18px}.section{background:#09111d;border:1px solid #19263a;border-radius:13px;padding:16px}.section h4{margin:0 0 13px}.supplierText{color:#9cacc1;line-height:1.5;padding:12px;background:#070d17;border-radius:9px}.field{margin-top:13px}.field label{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#91a2ba;margin-bottom:7px}.titleInput,textarea{width:100%;background:#070d17;color:white;border:1px solid #26364e;border-radius:9px;padding:12px;font:inherit;outline:none}.titleInput:focus,textarea:focus{border-color:var(--blue)}textarea{min-height:210px;resize:vertical;line-height:1.45}.previewBox{margin-top:12px;background:#fff;color:#20242b;border-radius:10px;padding:18px;min-height:150px;max-height:310px;overflow:auto}.financials{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.mini{background:#0d1726;border:1px solid #1c2a3f;padding:11px;border-radius:9px}.mini b{display:block;margin-top:5px}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.approvedCard{border-color:#245b48}.skippedCard{opacity:.55}.auth{position:fixed;inset:0;background:#02050aee;display:flex;align-items:center;justify-content:center;z-index:100}.authbox{width:min(440px,92vw);background:#0d1422;border:1px solid var(--line);border-radius:18px;padding:28px}.hidden{display:none}input{width:100%;padding:12px;background:#080e19;border:1px solid var(--line);border-radius:9px;color:#fff}.orderSummary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.orderCard{background:#0b121f;border:1px solid var(--line);border-radius:13px;padding:17px;margin-top:12px}.row{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid #1a2638}.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.calc label{color:var(--muted);font-size:12px}.pricingBreak{margin-top:12px;padding:13px;border:1px solid #1d3049;border-radius:11px;background:#0a1422}.pricingBreak .row:last-child{border-bottom:0}.pass{color:var(--green);font-weight:800}.review{color:var(--red);font-weight:800}@media(max-width:1100px){.metrics,.financials{grid-template-columns:repeat(2,1fr)}.listingBody{grid-template-columns:1fr}.listingHead{grid-template-columns:80px 1fr}.listingHead .actions{grid-column:1/-1}.calc{grid-template-columns:1fr 1fr}}@media(max-width:650px){.metrics,.financials,.calc{grid-template-columns:1fr}.wrap{padding:18px}.brand{display:none}}
</style></head><body>
<header class="topbar"><div class="brand">THEPHONE<span>SEARCH</span></div><nav><button class="nav" onclick="dashboard()">Overview</button><button class="nav" onclick="products()">Products</button><button class="nav" onclick="preview()">Listings</button><button class="nav" onclick="orders()">Orders</button><button class="nav" onclick="pricing()">Pricing</button><button class="nav" onclick="shipping()">Shipping</button></nav><button class="btn" onclick="preview()">Sync Preview</button><button class="btn secondary" onclick="logout()">Lock</button></header>
<main class="wrap"><div class="hero"><div><div class="eyebrow">Commerce Control Center</div><h1 id="heading">Seller Dashboard</h1><div id="sub" class="muted">Monitor your eBay and MobileParts operation.</div></div></div><div class="metrics"><div class="metric"><div class="label">eBay Connection</div><div id="ebay" class="value">Checking</div></div><div class="metric"><div class="label">MobileParts</div><div id="mps" class="value">Checking</div></div><div class="metric"><div class="label">Marketplace</div><div class="value">eBay DE</div></div><div class="metric"><div class="label">Minimum Margin</div><div class="value">30%</div></div><div class="metric"><div class="label">Master Control</div><div id="liveMode" class="value warn">SAFE</div></div></div><section id="panel" class="panel"><h2 id="title">System overview</h2><div id="content">Loading…</div></section></main>
<div id="auth" class="auth"><div class="authbox"><div class="eyebrow">ThePhoneSearch</div><h2>Seller Manager</h2><p class="muted">Enter administrator token.</p><input id="adminToken" type="password"><button class="btn" style="width:100%;margin-top:12px" onclick="login()">Unlock dashboard</button><div id="authErr" class="bad" style="margin-top:10px"></div></div></div>
<script>
const C=content,T=title,P=panel,H=heading,S=sub;let TOKEN=sessionStorage.getItem('tps_admin_token')||'';let REVIEW={};function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(x){return isFinite(Number(x))?'€'+Number(x).toFixed(2):'—'}function page(h,s){H.textContent=h;S.textContent=s}function normal(){P.classList.remove('productsPanel');T.style.display='block'}
async function req(u,opt={}){let h={...(opt.headers||{})};if(TOKEN)h['x-admin-token']=TOKEN;let r=await fetch(u,{...opt,headers:h}),txt=await r.text(),d;try{d=txt?JSON.parse(txt):{}}catch{d={error:txt}}if(r.status===401){TOKEN='';sessionStorage.removeItem('tps_admin_token');showAuth('Incorrect administrator token.');throw Error('Unauthorized')}if(!r.ok&&r.status!==207)throw Error(d.error||'HTTP '+r.status);return d}function showAuth(m=''){auth.classList.remove('hidden');authErr.textContent=m}function hideAuth(){auth.classList.add('hidden')}async function login(){TOKEN=adminToken.value.trim();try{await req('/api/status');sessionStorage.setItem('tps_admin_token',TOKEN);hideAuth();dashboard()}catch(e){showAuth(e.message)}}function logout(){TOKEN='';sessionStorage.removeItem('tps_admin_token');showAuth('Dashboard locked.')}
function capabilityCard(label,c){return '<div class="metric"><div class="label">'+esc(label)+'</div><div class="value '+(c?.enabled?'good':'warn')+'">'+(c?.enabled?'ARMED':'OFF')+'</div></div>'}
async function dashboard(){normal();page('Seller Dashboard','Monitor your eBay and MobileParts operation.');T.textContent='System overview';C.textContent='Loading…';try{let x=await req('/api/status'),lc=x.liveControl||{},caps=lc.capabilities||{};ebay.innerHTML=x.ebay?.ok?'<span class="good">Connected</span>':'<span class="bad">Attention</span>';mps.innerHTML=x.mps?.ok?'<span class="good">Connected</span>':'<span class="bad">Attention</span>';liveMode.className='value '+(lc.masterEnabled?'bad':'good');liveMode.textContent=lc.masterEnabled?'LIVE':'SAFE';C.innerHTML='<div class="notice">'+(lc.masterEnabled?'LIVE mode is armed. Only the capabilities shown below can perform writes.':'SAFE / PREVIEW — public eBay writes and money-moving actions are locked server-side.')+'</div><div class="orderSummary" style="margin-top:15px"><div class="metric"><div class="label">OAuth</div><div class="value">'+(x.config?.ebayRefreshReady?'Ready':'Missing')+'</div></div><div class="metric"><div class="label">Inventory location</div><div class="value" style="font-size:16px">'+esc(x.inventoryLocation)+'</div></div>'+capabilityCard('Listing publishing',caps.listingWrites)+capabilityCard('Stock / price sync',caps.stockPriceSync)+capabilityCard('Tracking writes',caps.trackingWrites)+capabilityCard('Supplier basket prep',caps.supplierOrderPreparation)+capabilityCard('Automatic purchase',caps.supplierAutoPurchase)+'</div><div class="notice" style="margin-top:15px">The runtime switch is not yet persisted in durable storage, so activation remains unavailable from this screen. Automatic supplier purchasing stays permanently locked until idempotency and payment safety are implemented.</div>'}catch(e){C.textContent=e.message}}
function products(){page('Product Catalogue','Browse MobileParts by device, brand, model and part category.');T.style.display='none';P.classList.add('productsPanel');C.innerHTML='<iframe class="catalogFrame" src="/catalog-browser.html?embedded=1"></iframe>'}
function safePreview(html){return String(html||'').replace(/<script[\s\S]*?<\/script>/gi,'').replace(/\son\w+\s*=\s*(["\']).*?\1/gi,'')}
function stateFor(p){if(!REVIEW[p.sku])REVIEW[p.sku]={title:p.optimizedTitle||p.title||'',description:p.description||'',status:'review'};return REVIEW[p.sku]}
function pricingRows(p){let f=p.pricing;if(!f)return '';return '<div class="pricingBreak"><div class="row"><span class="muted">Minimum 30% price</span><b>'+money(f.minimumItemPrice)+'</b></div><div class="row"><span class="muted">Supplier item</span><b>'+money(f.supplierCost)+'</b></div><div class="row"><span class="muted">Supplier shipping</span><b>'+money(f.supplierShipping)+'</b></div><div class="row"><span class="muted">Customer shipping</span><b>'+money(f.customerShipping)+'</b></div><div class="row"><span class="muted">Total eBay charges</span><b>'+money(f.totalEbayCharges)+'</b></div><div class="row"><span class="muted">Net profit</span><b class="good">'+money(f.netProfit)+'</b></div><div class="row"><span class="muted">Net margin</span><b class="'+(f.marginPass?'pass':'review')+'">'+Number(f.netMargin).toFixed(1)+'% · '+(f.marginPass?'PASS':'REVIEW')+'</b></div></div>'}
function listingCard(p,i){let r=stateFor(p),len=r.title.length,status=r.status;return '<article id="card-'+i+'" class="listing '+(status==='approved'?'approvedCard':status==='skipped'?'skippedCard':'')+'"><div class="listingHead">'+(p.images?.[0]?'<img class="thumb" src="'+esc(p.images[0])+'" referrerpolicy="no-referrer">':'<div class="thumb"></div>')+'<div><div class="listingTitle">'+esc(r.title||p.supplierTitle||p.sku)+'</div><div class="chips"><span class="chip">SKU '+esc(p.sku)+'</span><span class="chip">Stock '+esc(p.stock)+'</span><span class="chip">Cost '+money(p.costExVat)+'</span><span class="chip">eBay '+money(p.calculatedPrice)+'</span><span class="chip">Margin '+(p.pricing?Number(p.pricing.netMargin).toFixed(1)+'%':'—')+'</span><span class="chip">Category '+esc(p.categoryId||'Review')+'</span><span class="chip">'+esc(p.contentSource||'Built-in optimiser')+'</span></div></div><div class="actions"><button class="btn approve" onclick="setStatus(\''+esc(p.sku)+'\','+i+',\'approved\')">Approve</button><button class="btn secondary" onclick="focusEdit('+i+')">Edit</button><button class="btn skip" onclick="setStatus(\''+esc(p.sku)+'\','+i+',\'skipped\')">Skip</button></div></div><div class="listingBody"><div class="section"><h4>Supplier information & pricing</h4><div class="label">Supplier title</div><div class="supplierText">'+esc(p.supplierTitle||'—')+'</div><div class="financials"><div class="mini"><span class="label">SKU</span><b>'+esc(p.sku)+'</b></div><div class="mini"><span class="label">Stock</span><b>'+esc(p.stock)+'</b></div><div class="mini"><span class="label">Supplier</span><b>'+money(p.costExVat)+'</b></div><div class="mini"><span class="label">Selling price</span><b>'+money(p.calculatedPrice)+'</b></div></div>'+pricingRows(p)+'<div class="field"><label><span>Optimised / final eBay title</span><span id="count-'+i+'" class="'+(len>80?'bad':'good')+'">'+len+'/80</span></label><input id="title-'+i+'" class="titleInput" maxlength="80" value="'+esc(r.title)+'" oninput="editTitle(\''+esc(p.sku)+'\','+i+',this.value)"></div></div><div class="section"><h4>Optimised eBay description</h4><div class="field"><label><span>Editable HTML description</span><span>'+esc(p.contentSource||'optimised')+'</span></label><textarea id="desc-'+i+'" oninput="editDesc(\''+esc(p.sku)+'\','+i+',this.value)">'+esc(r.description)+'</textarea></div><div class="label" style="margin-top:13px">Customer preview</div><div id="html-'+i+'" class="previewBox">'+safePreview(r.description)+'</div></div></div></article>'}
async function preview(){normal();page('Listing Workspace','Review titles, descriptions and the real 30% minimum-margin pricing before publication.');T.textContent='Listing review';C.textContent='Building supplier preview…';try{let x=await req('/api/sync-preview?limit=25'),a=x.items||[];window.LISTINGS=a;let ai=x.aiConfigured?'AI available':'Built-in optimiser',ship=x.pricingConfig?.supplierShipping||0,cust=x.pricingConfig?.customerShipping||0;C.innerHTML='<div class="notice">DRY RUN — publishing is OFF. 30% is the minimum net margin. Current shipping config: supplier '+money(ship)+' · customer '+money(cust)+'.</div><div class="listingToolbar"><div><b>'+a.length+' products loaded</b> <span class="muted">· '+ai+'</span></div><div class="actions"><button class="btn approve" onclick="bulkStatus(\'approved\')">Approve All Loaded</button><button class="btn skip" onclick="bulkStatus(\'skipped\')">Skip All</button></div></div><div id="listingGrid" class="listingGrid">'+a.map(listingCard).join('')+'</div>'}catch(e){C.textContent=e.message}}
function editTitle(sku,i,v){stateFor(LISTINGS[i]).title=v;let n=v.length,c=document.getElementById('count-'+i);c.textContent=n+'/80';c.className=n>80?'bad':'good';document.querySelector('#card-'+i+' .listingTitle').textContent=v}function editDesc(sku,i,v){stateFor(LISTINGS[i]).description=v;document.getElementById('html-'+i).innerHTML=safePreview(v)}function focusEdit(i){document.getElementById('title-'+i).focus()}function setStatus(sku,i,s){stateFor(LISTINGS[i]).status=s;let c=document.getElementById('card-'+i);c.classList.toggle('approvedCard',s==='approved');c.classList.toggle('skippedCard',s==='skipped')}function bulkStatus(s){(LISTINGS||[]).forEach((p,i)=>setStatus(p.sku,i,s))}
function addr(o){let s=o.shipTo||{},a=s.contactAddress||s;return [s.fullName||a.fullName,a.addressLine1,a.addressLine2,[a.postalCode,a.city].filter(Boolean).join(' '),a.countryCode].filter(Boolean).map(esc).join('<br>')}function aggregate(a){let fs=a.map(o=>o.financials).filter(Boolean),sum=k=>fs.reduce((n,f)=>n+(+f[k]||0),0),rev=sum('totalRevenue'),profit=sum('netProfit');return{count:fs.length,rev,cost:sum('totalCosts'),supplier:sum('supplierCost')+sum('supplierShipping'),ebay:sum('totalEbayCharges'),profit,margin:rev?profit/rev*100:0}}
async function orders(){normal();page('Order Management','Combined costs and profit across every order.');T.textContent='Orders';C.textContent='Loading orders…';try{let x=await req('/api/orders-preview'),a=x.orders||[],g=aggregate(a);C.innerHTML=(g.count?'<div class="orderSummary"><div class="metric"><div class="label">Orders</div><div class="value">'+g.count+'</div></div><div class="metric"><div class="label">Money in</div><div class="value">'+money(g.rev)+'</div></div><div class="metric"><div class="label">Money out</div><div class="value bad">'+money(g.cost)+'</div></div><div class="metric"><div class="label">Net profit</div><div class="value good">'+money(g.profit)+'</div></div><div class="metric"><div class="label">Margin</div><div class="value '+(g.margin>=30?'good':'bad')+'">'+g.margin.toFixed(1)+'%</div></div></div>':'')+a.map(o=>'<div class="orderCard"><b>'+esc(o.orderId)+'</b> · '+esc(o.orderPaymentStatus||'')+'<div class="muted" style="margin-top:8px">'+(o.lineItems||[]).map(i=>esc(i.title)+' × '+esc(i.quantity||1)).join('<br>')+'</div></div>').join('')}catch(e){C.textContent=e.message}}
function localCalc(){let cost=+pcost.value||0,s=+psell.value||0,ss=+pship.value||0,cs=+pcharge.value||0,a=.11*1.19,b=.10*1.19,f=.35,rev=s+cs,fees=s*a+cs*b+f,total=cost+ss+fees,profit=rev-total,margin=rev?profit/rev*100:0;calcOut.innerHTML='<div class="orderSummary" style="margin-top:15px"><div class="metric"><div class="label">Money in</div><div class="value">'+money(rev)+'</div></div><div class="metric"><div class="label">Total costs</div><div class="value">'+money(total)+'</div></div><div class="metric"><div class="label">eBay charges</div><div class="value">'+money(fees)+'</div></div><div class="metric"><div class="label">Net profit</div><div class="value '+(profit>=0?'good':'bad')+'">'+money(profit)+'</div></div><div class="metric"><div class="label">Net margin</div><div class="value '+(margin>=30?'good':'bad')+'">'+margin.toFixed(1)+'%</div></div></div>'}
function pricing(){normal();page('Pricing Engine','30% is the minimum net margin; there is no maximum margin cap.');T.textContent='Profit calculator';C.innerHTML='<div class="notice">Uses your fee rules: 11% item fee + 19% VAT, €0.35 fixed, 10% shipping fee + 19% VAT. Competitor-based upside is the next pricing layer.</div><div class="calc" style="margin-top:15px"><label>Supplier cost<input id="pcost" type="number" value="50" oninput="localCalc()"></label><label>Selling price<input id="psell" type="number" value="100" oninput="localCalc()"></label><label>Supplier shipping<input id="pship" type="number" value="0" oninput="localCalc()"></label><label>Customer shipping<input id="pcharge" type="number" value="0" oninput="localCalc()"></label></div><div id="calcOut"></div>';localCalc()}function shipping(){normal();page('Shipping Profiles','Germany and EU supplier/delivery costs will be configured here.');T.textContent='Shipping';C.innerHTML='<div class="notice">Shipping profiles are not final yet. Germany and EU supplier rates still need to be configured before live publishing.</div>'}
adminToken.addEventListener('keydown',e=>{if(e.key==='Enter')login()});if(TOKEN){hideAuth();dashboard()}else showAuth();
</script></body></html>
