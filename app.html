<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThePhoneSearch Seller Manager</title><style>body{margin:0;font:14px Arial;background:#f5f7fb;color:#172033}header{background:#111827;color:#fff;padding:18px 24px;font-size:20px;font-weight:700}nav{display:flex;gap:8px;padding:14px 24px;background:#fff;border-bottom:1px solid #ddd}button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer}.primary{background:#2563eb;color:white}.wrap{padding:24px;max-width:1400px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:18px}.big{font-size:25px;font-weight:700;margin-top:8px}.panel{margin-top:18px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #eee}.muted{color:#667085}.good{color:#087443;font-weight:bold}.bad{color:#b42318;font-weight:bold}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}nav{overflow:auto}}</style></head><body><header>ThePhoneSearch Seller Manager</header><nav><button onclick="loadStatus()">Dashboard</button><button onclick="loadCatalog()">Products</button><button onclick="loadOrders()">Orders</button><button onclick="location.href='/dashboard.html'">Sync Manager</button><button class="primary" onclick="loadCatalog()">Refresh Catalogue</button></nav><main class="wrap"><div class="cards"><div class="card">eBay<div id="ebay" class="big">Checking…</div></div><div class="card">MobileParts<div id="mps" class="big">Checking…</div></div><div class="card">Pricing rule<div class="big">11% + €0.35</div><span class="muted">+ 19% VAT on eBay fee</span></div><div class="card">Publishing<div class="big">Manual review</div><span class="muted">Profit protection enabled</span></div></div><section class="panel"><h2 id="title">System status</h2><div id="content">Loading…</div></section></main><script>const C=document.getElementById('content'),T=document.getElementById('title');async function j(u){let r=await fetch(u);return r.json()}async function loadStatus(){T.textContent='System status';try{let x=await j('/api/status');C.innerHTML='<pre>'+JSON.stringify(x,null,2)+'</pre>';document.getElementById('ebay').innerHTML=x.ebay?.connected?'<span class="good">Connected</span>':'<span class="bad">Check</span>';document.getElementById('mps').innerHTML=x.mps?.connected?'<span class="good">Connected</span>':'<span class="bad">Check</span>'}catch(e){C.textContent=e}}async function loadCatalog(){T.textContent='MobileParts catalogue';C.textContent='Loading products…';try{let x=await j('/api/catalog');let a=x.products||x.items||x.data||[];if(!Array.isArray(a)){C.innerHTML='<pre>'+JSON.stringify(x,null,2)+'</pre>';return}C.innerHTML='<table><thead><tr><th>Product</th><th>SKU</th><th>Supplier price</th><th>Stock</th></tr></thead><tbody>'+a.slice(0,250).map(p=>'<tr><td>'+esc(p.name||p.title||p.description||'Product')+'</td><td>'+esc(p.sku||p.id||'')+'</td><td>'+esc(p.price||p.purchasePrice||'')+'</td><td>'+esc(p.stock??p.quantity??'')+'</td></tr>').join('')+'</tbody></table>'}catch(e){C.textContent=e}}async function loadOrders(){T.textContent='eBay orders';C.textContent='Loading orders…';try{let x=await j('/api/orders-preview');C.innerHTML='<pre>'+JSON.stringify(x,null,2)+'</pre>'}catch(e){C.textContent=e}}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}loadStatus()</script></body></html>
