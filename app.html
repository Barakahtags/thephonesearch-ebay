<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThePhoneSearch Seller Manager</title><style>*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:#f3f5f9;color:#172033}header{background:#101828;color:#fff;padding:17px 24px;display:flex;justify-content:space-between;align-items:center}header b{font-size:20px}nav{display:flex;gap:8px;padding:12px 24px;background:#fff;border-bottom:1px solid #e4e7ec;position:sticky;top:0;z-index:2}button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600}.primary{background:#2563eb;color:#fff}.secondary{background:#eef2f6;color:#344054}.danger{background:#fee4e2;color:#b42318}.wrap{padding:22px;max-width:1500px;margin:auto}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:17px}.big{font-size:23px;font-weight:700;margin-top:7px}.muted{color:#667085}.good{color:#067647;font-weight:700}.bad{color:#b42318;font-weight:700}.warn{color:#b54708;font-weight:700}.panel{margin-top:16px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}.toolbar input{max-width:380px;margin:0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #eee;vertical-align:middle}th{color:#475467;font-size:12px;text-transform:uppercase}img.thumb{width:58px;height:58px;object-fit:contain;background:#fff;border:1px solid #eee;border-radius:8px}.price{font-weight:700}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#ecfdf3;color:#067647;font-size:12px}.auth{position:fixed;inset:0;background:rgba(17,24,39,.76);display:flex;align-items:center;justify-content:center;z-index:10}.authbox{width:min(430px,90vw);background:#fff;border-radius:14px;padding:24px}.authbox input,input,select{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:8px;margin:8px 0}.hidden{display:none}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.calc label{font-size:12px;color:#475467}pre{white-space:pre-wrap;overflow:auto}.notice{padding:12px;background:#fffaeb;border:1px solid #fedf89;border-radius:8px;color:#93370d}.right{margin-left:auto}@media(max-width:950px){.cards{grid-template-columns:1fr 1fr}.grid2,.calc{grid-template-columns:1fr}nav{overflow:auto}.wrap{padding:12px}}</style></head><body><header><b>ThePhoneSearch Seller Manager</b><button class="danger" onclick="logout()">Lock</button></header><nav><button class="secondary" onclick="dashboard()">Dashboard</button><button class="secondary" onclick="products()">Products</button><button class="secondary" onclick="preview()">Listing Preview</button><button class="secondary" onclick="orders()">Orders</button><button class="secondary" onclick="pricing()">Pricing</button><button class="secondary" onclick="shipping()">Shipping</button><button class="primary" onclick="preview()">Sync Preview</button></nav><main class="wrap"><div class="cards"><div class="card">eBay<div id="ebay" class="big">—</div></div><div class="card">MobileParts<div id="mps" class="big">—</div></div><div class="card">Marketplace<div class="big">eBay DE</div></div><div class="card">Fee rule<div class="big">11% + €0.35</div><span class="muted">19% VAT on eBay fee</span></div><div class="card">Publishing<div class="big warn">Preview</div><span class="muted">Manual approval</span></div></div><section class="panel"><h2 id="title">Dashboard</h2><div id="content">Loading…</div></section></main><div id="auth" class="auth"><div class="authbox"><h2>Seller Manager Login</h2><p class="muted">Enter the ADMIN_TOKEN configured in Vercel.</p><input id="adminToken" type="password" autocomplete="off" placeholder="Admin token"><button class="primary" style="width:100%" onclick="login()">Unlock Manager</button><div id="authErr" class="bad" style="margin-top:12px"></div></div></div><script>const C=document.getElementById('content'),T=document.getElementById('title');let TOKEN=sessionStorage.getItem('tps_admin_token')||'',cache=[];const feeRate=.11,feeVat=.19,fixed=.35;function showAuth(m=''){auth.classList.remove('hidden');authErr.textContent=m;adminToken.focus()}function hideAuth(){auth.classList.add('hidden')}async function req(u,opt={}){let h={...(opt.headers||{})};if(TOKEN)h['x-admin-token']=TOKEN;let r=await fetch(u,{...opt,headers:h}),txt=await r.text(),d;try{d=txt?JSON.parse(txt):{}}catch{d={error:txt}}if(r.status===401){TOKEN='';sessionStorage.removeItem('tps_admin_token');showAuth('Incorrect admin token.');throw Error('Unauthorized')}if(!r.ok&&r.status!==207)throw Error(d.error||'HTTP '+r.status);return d}async function login(){TOKEN=adminToken.value.trim();try{await req('/api/status');sessionStorage.setItem('tps_admin_token',TOKEN);hideAuth();dashboard()}catch(e){if(e.message!=='Unauthorized')showAuth(e.message)}}function logout(){TOKEN='';sessionStorage.removeItem('tps_admin_token');showAuth('Manager locked.')}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(x){return isFinite(Number(x))?'€'+Number(x).toFixed(2):'—'}async function dashboard(){T.textContent='Dashboard';C.innerHTML='Loading system status…';try{let x=await req('/api/status');ebay.innerHTML=x.ebay?.ok?'<span class="good">Connected</span>':'<span class="bad">Check</span>';mps.innerHTML=x.mps?.ok?'<span class="good">Connected</span>':'<span class="bad">Check</span>';C.innerHTML='<div class="grid2"><div><h3>Connections</h3><p>eBay: <b class="good">'+(x.ebay?.ok?'Working':'Check')+'</b></p><p>MobileParts: <b class="good">'+(x.mps?.ok?'Working':'Check')+'</b></p><p>Refresh token: <b>'+(x.config?.ebayRefreshReady?'Ready':'Missing')+'</b></p><p>Inventory: <b>'+esc(x.inventoryLocation)+'</b></p></div><div><h3>Safety</h3><div class="notice">Publishing remains OFF. Products are reviewed in Listing Preview before any live publishing workflow is enabled.</div><p>Fulfilment policies: <b>'+esc(x.policies?.counts?.fulfillment)+'</b></p><p>Payment policies: <b>'+esc(x.policies?.counts?.payment)+'</b></p><p>Return policies: <b>'+esc(x.policies?.counts?.returns)+'</b></p></div></div>'}catch(e){C.textContent=e.message}}async function products(){T.textContent='MobileParts Products';C.innerHTML='Loading catalogue…';try{let x=await req('/api/catalog'),a=x.products||x.items||x.data||x.Parts||[];if(!Array.isArray(a)){C.innerHTML='<pre>'+esc(JSON.stringify(x,null,2))+'</pre>';return}cache=a;renderProducts(a)}catch(e){C.textContent=e.message}}function renderProducts(a){C.innerHTML='<div class="toolbar"><input id="q" placeholder="Search product or SKU" oninput="filterProducts()"><span class="muted">'+a.length+' products loaded</span></div><div style="overflow:auto"><table><thead><tr><th>Product</th><th>SKU</th><th>Supplier cost</th><th>Stock</th><th>Status</th></tr></thead><tbody>'+a.slice(0,500).map(p=>'<tr><td>'+esc(p.Description||p.name||p.title||'Product')+'</td><td>'+esc(p.PartNumber||p.sku||p.id)+'</td><td class="price">'+money(p.UnitPrice??p.price??p.purchasePrice)+'</td><td>'+esc(p.AvailableStockQuantity??p.stock??p.quantity)+'</td><td><span class="pill">Supplier</span></td></tr>').join('')+'</tbody></table></div>'}function filterProducts(){let s=q.value.toLowerCase();renderProducts(cache.filter(p=>JSON.stringify(p).toLowerCase().includes(s)))}async function preview(){T.textContent='Listing Preview';C.innerHTML='Building live supplier preview…';try{let x=await req('/api/sync-preview?limit=25'),a=x.items||[];C.innerHTML='<div class="notice">DRY RUN — nothing on this page is published to eBay.</div><div style="overflow:auto;margin-top:12px"><table><thead><tr><th>Image</th><th>Product</th><th>SKU</th><th>Stock</th><th>Cost ex VAT</th><th>Calculated eBay price</th><th>Category</th></tr></thead><tbody>'+a.map(p=>'<tr><td>'+(p.images?.[0]?'<img class="thumb" src="'+esc(p.images[0])+'" referrerpolicy="no-referrer">':'—')+'</td><td>'+esc(p.title)+'</td><td>'+esc(p.sku)+'</td><td>'+esc(p.stock)+'</td><td>'+money(p.costExVat)+'</td><td class="price">'+money(p.calculatedPrice)+'</td><td>'+esc(p.categoryId||p.categoryError||'—')+'</td></tr>').join('')+'</tbody></table></div>'}catch(e){C.textContent=e.message}}async function orders(){T.textContent='eBay Orders';C.innerHTML='Loading orders…';try{let x=await req('/api/orders-preview'),a=x.orders||x.data?.orders||[];if(!Array.isArray(a)||!a.length){C.innerHTML='<p class="muted">No orders returned right now.</p><pre>'+esc(JSON.stringify(x,null,2))+'</pre>';return}C.innerHTML='<table><thead><tr><th>Order</th><th>Buyer</th><th>Status</th><th>Total</th></tr></thead><tbody>'+a.map(o=>'<tr><td>'+esc(o.orderId)+'</td><td>'+esc(o.buyer?.username||o.buyer?.buyerRegistrationAddress?.fullName||'—')+'</td><td>'+esc(o.orderFulfillmentStatus||o.orderPaymentStatus)+'</td><td>'+money(o.pricingSummary?.total?.value)+'</td></tr>').join('')+'</tbody></table>'}catch(e){C.textContent=e.message}}function pricing(){T.textContent='Pricing & Profit Calculator';C.innerHTML='<p class="muted">Use this to check a selling price before listing. eBay fee is calculated as 11% + €0.35, with 19% VAT applied to the percentage eBay fee.</p><div class="calc"><label>Supplier cost €<input id="pcost" type="number" step=".01" value="50" oninput="calc()"></label><label>Selling price €<input id="psell" type="number" step=".01" value="80" oninput="calc()"></label><label>Shipping cost €<input id="pship" type="number" step=".01" value="0" oninput="calc()"></label><label>Other cost €<input id="pother" type="number" step=".01" value="0" oninput="calc()"></label></div><div id="calcOut"></div>';calc()}function calc(){let c=+pcost.value||0,s=+psell.value||0,sh=+pship.value||0,o=+pother.value||0,percent=s*feeRate,vat=percent*feeVat,fees=percent+vat+fixed,profit=s-c-sh-o-fees,margin=s?profit/s*100:0;calcOut.innerHTML='<div class="cards" style="margin-top:12px"><div class="card">eBay fees<div class="big">'+money(fees)+'</div></div><div class="card">Net profit<div class="big '+(profit>=0?'good':'bad')+'">'+money(profit)+'</div></div><div class="card">Profit margin<div class="big">'+margin.toFixed(1)+'%</div></div><div class="card">Break-even<div class="big">'+money(c+sh+o+fees)+'</div></div></div>'}function shipping(){T.textContent='Shipping Profiles';C.innerHTML='<div class="notice">Shipping policies already exist on eBay. This manager will keep Germany and EU shipping separate so supplier delivery costs can be priced correctly before publishing.</div><div class="grid2" style="margin-top:14px"><div class="card"><h3>Germany / Local</h3><p>Use the dedicated domestic fulfilment policy for German buyers.</p><p class="muted">Current policy management is handled by the connected eBay business policies.</p></div><div class="card"><h3>European Union</h3><p>Use a separate EU fulfilment profile so higher cross-border supplier postage is not absorbed into margin.</p><p class="muted">Publishing remains disabled until these rates are reviewed.</p></div></div>'}adminToken.addEventListener('keydown',e=>{if(e.key==='Enter')login()});if(TOKEN){hideAuth();dashboard()}else showAuth()</script></body></html>
