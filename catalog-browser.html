<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parts Browser</title><style>*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#f5f7fb;color:#172033}.top{padding:16px 22px;background:#111827;color:white;font-size:20px;font-weight:700}.browserbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:16px 22px;display:grid;grid-template-columns:220px 260px minmax(420px,1fr);gap:18px;align-items:start}.group{margin:0}.group h3{margin:0 0 8px;font-size:14px}.brand,.model,.cat,.typebtn{border:0;background:none;padding:8px 9px;border-radius:7px;cursor:pointer}.brand:hover,.model:hover,.cat:hover,.typebtn:hover,.active{background:#eaf2ff;color:#175cd3}.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}.typebtn{border:1px solid #e5e7eb;background:#fff;text-align:center;padding:11px;width:100%}.typebtn.active{background:#2563eb;color:#fff}.brandgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px}.brand{display:block;width:100%;text-align:left}.modelwrap{display:grid;grid-template-columns:260px 1fr;gap:12px}.select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px;margin:0}.modelgrid{display:grid;grid-template-columns:repeat(4,minmax(145px,1fr));gap:3px 8px;max-height:210px;overflow:auto}.model{display:block;width:100%;text-align:left;white-space:nowrap}.content{padding:22px}.cats{display:flex;gap:10px;overflow:auto;padding:4px 0 12px}.cat{min-width:150px;background:#fff;border:1px solid #e5e7eb;text-align:center;padding:14px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}.toolbar input{flex:1;min-width:260px;padding:10px;border:1px solid #d0d5dd;border-radius:8px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:10px;display:grid;grid-template-columns:90px 1fr 130px 110px;gap:14px;align-items:center}.card img{width:80px;height:80px;object-fit:contain}.muted{color:#667085}.price{font-size:18px;font-weight:700}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#ecfdf3;color:#067647}.auth{position:fixed;inset:0;background:rgba(17,24,39,.75);display:flex;align-items:center;justify-content:center}.authbox{background:white;padding:24px;border-radius:14px;width:min(420px,90vw)}.authbox input{width:100%;padding:12px;margin:10px 0;border:1px solid #d0d5dd;border-radius:8px}.authbox button,.primary{background:#2563eb;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}.hidden{display:none}@media(max-width:1100px){.browserbar{grid-template-columns:1fr 1fr}.browserbar .group:last-child{grid-column:1/-1}.modelgrid{grid-template-columns:repeat(3,minmax(140px,1fr))}}@media(max-width:760px){.browserbar{grid-template-columns:1fr}.browserbar .group:last-child{grid-column:auto}.modelwrap{grid-template-columns:1fr}.modelgrid{grid-template-columns:repeat(2,minmax(130px,1fr));max-height:none}.card{grid-template-columns:70px 1fr}.card>div:nth-child(n+3){grid-column:2}.content{padding:12px}}</style></head><body><div class="top">ThePhoneSearch Parts Browser</div><div class="browserbar"><div class="group"><h3>Article type</h3><div class="types"><button id="type1" class="typebtn active" onclick="changeType(1)">Parts</button><button id="type2" class="typebtn" onclick="changeType(2)">Accessories</button><button id="type3" class="typebtn" onclick="changeType(3)">Tools</button><button id="type4" class="typebtn" onclick="changeType(4)">Devices</button></div></div><div class="group"><h3>Brand</h3><div id="brands" class="brandgrid"></div></div><div class="group"><h3>Model</h3><div class="modelwrap"><input id="model" class="select" placeholder="e.g. iPhone 17 Pro Max" onkeydown="if(event.key==='Enter')runSearch()"><div id="models" class="modelgrid"></div></div></div></div><main class="content"><h2 id="heading">Choose a brand and model</h2><div class="cats" id="cats"></div><div class="toolbar"><input id="q" placeholder="Search within this selection" onkeydown="if(event.key==='Enter')runSearch()"><button class="primary" onclick="runSearch()">Search</button><span id="count" class="muted"></span></div><div id="results"></div></main><div id="auth" class="auth"><div class="authbox"><h2>Unlock Parts Browser</h2><input id="tok" type="password" placeholder="ADMIN_TOKEN"><button onclick="login()">Unlock</button><div id="err" style="color:#b42318;margin-top:10px"></div></div></div><script>const BRANDS=['Apple','Google','Honor','Huawei','Motorola','Nokia','OnePlus','OPPO','Realme','Samsung','Sony','Xiaomi'];const MODELS={Apple:['iPhone 17 Pro Max','iPhone 17 Pro','iPhone 17e','iPhone Air','iPhone 17','iPhone 16 Pro Max','iPhone 16 Pro','iPhone 16 Plus','iPhone 16e','iPhone 16','iPhone 15 Pro Max','iPhone 15 Pro','iPhone 15 Plus','iPhone 15','iPhone 14 Pro Max','iPhone 14 Pro','iPhone 14 Plus','iPhone 14','iPhone 13 Pro Max','iPhone 13 Pro','iPhone 13 mini','iPhone 13','iPhone 12 Pro Max','iPhone 12 Pro','iPhone 12 mini','iPhone 12','iPhone SE (3rd generation)','iPhone 11 Pro Max','iPhone 11 Pro','iPhone 11','iPhone XS Max','iPhone XS','iPhone XR','iPhone X'],Google:['Pixel 10 Pro XL','Pixel 10 Pro','Pixel 10','Pixel 9 Pro XL','Pixel 9 Pro','Pixel 9','Pixel 9a','Pixel 8 Pro','Pixel 8','Pixel 8a','Pixel 7 Pro','Pixel 7','Pixel 7a','Pixel 6 Pro','Pixel 6','Pixel 6a','Pixel 5','Pixel 4a'],Samsung:['Galaxy S26 Ultra','Galaxy S26+','Galaxy S26','Galaxy S25 Ultra','Galaxy S25+','Galaxy S25','Galaxy S24 Ultra','Galaxy S24+','Galaxy S24','Galaxy S23 Ultra','Galaxy S23+','Galaxy S23','Galaxy S22 Ultra','Galaxy S22+','Galaxy S22','Galaxy A56','Galaxy A55','Galaxy A54','Galaxy A53','Galaxy A36','Galaxy A35','Galaxy A34','Galaxy Z Fold 7','Galaxy Z Flip 7','Galaxy Z Fold 6','Galaxy Z Flip 6'],Huawei:['Pura 80 Ultra','Pura 80 Pro','Pura 80','Pura 70 Ultra','Pura 70 Pro','Pura 70','Mate 70 Pro','Mate 70','Mate 60 Pro','Mate 60','P60 Pro','P60','P50 Pro','P50','Mate 50 Pro','Mate 50','P40 Pro','P40'],Honor:['Magic8 Pro','Magic8','Magic7 Pro','Magic7','Magic6 Pro','Magic6','Honor 400 Pro','Honor 400','Honor 200 Pro','Honor 200','Honor 90','Honor 70','Magic5 Pro','Magic5'],Motorola:['Edge 60 Pro','Edge 60','Edge 50 Ultra','Edge 50 Pro','Edge 50 Fusion','Razr 60 Ultra','Razr 60','Razr 50 Ultra','Razr 50','Moto G85','Moto G75','Moto G55','Moto G54','Moto G84'],Nokia:['G60 5G','G50','G42 5G','G22','X30 5G','X20','X10','C32','C22','XR21','XR20','8.3 5G','7.2','6.2'],OnePlus:['OnePlus 15','OnePlus 14','OnePlus 13','OnePlus 13R','OnePlus 12','OnePlus 12R','OnePlus 11','OnePlus 10 Pro','OnePlus 10T','OnePlus 9 Pro','OnePlus 9','OnePlus Nord 5','OnePlus Nord 4','OnePlus Nord 3','OnePlus Nord 2T'],OPPO:['Find X8 Pro','Find X8','Find X7 Ultra','Find X7','Find X6 Pro','Find X6','Reno 14 Pro','Reno 14','Reno 13 Pro','Reno 13','Reno 12 Pro','Reno 12','Reno 11 Pro','Reno 11','A5 Pro','A3 Pro','A98 5G','A78 5G'],Realme:['GT 7 Pro','GT 7','GT 6','GT 5 Pro','GT Neo 6','Realme 14 Pro+','Realme 14 Pro','Realme 13 Pro+','Realme 13 Pro','Realme 12 Pro+','Realme 12 Pro','C75','C67'],Sony:['Xperia 1 VII','Xperia 1 VI','Xperia 1 V','Xperia 5 V','Xperia 10 VII','Xperia 10 VI','Xperia 10 V','Xperia 1 IV','Xperia 5 IV','Xperia 10 IV','Xperia 1 III','Xperia 5 III'],Xiaomi:['Xiaomi 16 Ultra','Xiaomi 16 Pro','Xiaomi 16','Xiaomi 15 Ultra','Xiaomi 15 Pro','Xiaomi 15','Xiaomi 14 Ultra','Xiaomi 14 Pro','Xiaomi 14','Xiaomi 13 Ultra','Xiaomi 13 Pro','Xiaomi 13','Redmi Note 14 Pro+','Redmi Note 14 Pro','Redmi Note 14','Redmi Note 13 Pro+','Redmi Note 13 Pro','Redmi Note 13','POCO F7 Ultra','POCO F7 Pro','POCO F7','POCO X7 Pro','POCO X7']};const CATS=[['Display',['display','lcd','screen','oled']],['Battery',['battery','akku']],['Flex cable',['flex']],['Housing / case',['housing','case','back cover','back glass','frame']],['Dock connector',['dock','charging','connector']],['Camera',['camera']],['Audio (speaker / mic)',['speaker','microphone','earpiece','audio']],['Antenna',['antenna']],['Adhesive tape',['adhesive','tape','sticker']]];let TOKEN=sessionStorage.getItem('tps_admin_token')||'',brand='',all=[],articleType=1;function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}async function req(u){let r=await fetch(u,{headers:{'x-admin-token':TOKEN}}),t=await r.text(),d;try{d=JSON.parse(t)}catch{d={error:t}}if(r.status===401)throw Error('Unauthorized');if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d}async function login(){TOKEN=tok.value.trim();try{await req('/api/status');sessionStorage.setItem('tps_admin_token',TOKEN);auth.classList.add('hidden');renderBrands()}catch(e){err.textContent='Incorrect ADMIN_TOKEN'}}function changeType(n){articleType=n;for(let i=1;i<=4;i++)document.getElementById('type'+i).classList.toggle('active',i===n);all=[];cats.innerHTML='';results.innerHTML='';count.textContent='';q.value='';if(n!==1){brand='';model.value='';renderBrands();heading.textContent=['','Parts','Accessories','Tools','Devices'][n];}else{heading.textContent=brand||'Choose a brand and model';renderBrands();}runSearch()}function renderBrands(){brands.innerHTML=BRANDS.map(b=>'<button class="brand '+(b===brand?'active':'')+'" onclick="chooseBrand(\''+b.replace(/'/g,"\\'")+'\')">'+b+'</button>').join('');renderModels()}function chooseBrand(b){brand=b;model.value='';renderBrands();heading.textContent=b+(articleType===1?' parts':'');runSearch()}function renderModels(){models.innerHTML=(articleType===1?(MODELS[brand]||[]):[]).map(m=>'<button class="model" onclick="chooseModel(\''+m.replace(/'/g,"\\'")+'\')">'+m+'</button>').join('')}function chooseModel(m){articleType=1;for(let i=1;i<=4;i++)document.getElementById('type'+i).classList.toggle('active',i===1);model.value=m;heading.textContent=(brand?brand+' → ':'')+m;runSearch()}function categoryOf(title){let s=(title||'').toLowerCase();for(const [name,keys] of CATS)if(keys.some(k=>s.includes(k)))return name;return'Other parts'}function renderCats(){if(articleType!==1){cats.innerHTML='';return}let names=[...new Set(all.map(x=>categoryOf(x.title)))];cats.innerHTML=names.map(n=>'<button class="cat" onclick="filterCat(\''+n.replace(/'/g,"\\'")+'\')">'+esc(n)+'</button>').join('')}function filterCat(n){renderResults(all.filter(x=>categoryOf(x.title)===n));heading.textContent=(model.value||brand||'Products')+' — '+n}async function runSearch(){let mdl=model.value.trim();let terms;if(articleType===1)terms=[brand,mdl,q.value.trim()].filter(Boolean).join(' ').trim();else terms=q.value.trim()||brand;if(!terms){results.innerHTML='<p class="muted">'+(articleType===1?'Choose a brand or enter a model.':'Enter a search term or choose a brand.')+'</p>';return}results.innerHTML='Loading MobileParts products…';try{let d=await req('/api/catalog?q='+encodeURIComponent(terms)+'&articleType='+articleType+'&pageSize=100');let items=d.items||[];if(articleType===1&&mdl){const target=norm(mdl);items=items.filter(x=>norm(x.title).includes(target));}all=items;count.textContent=all.length+' exact matching articles';heading.textContent=articleType===1?([brand,mdl].filter(Boolean).join(' → ')||terms):(['','Parts','Accessories','Tools','Devices'][articleType]+(terms?' — '+terms:''));renderCats();renderResults(all)}catch(e){results.innerHTML='<p style="color:#b42318">'+esc(e.message)+'</p>'}}function renderResults(a){if(!a.length){results.innerHTML='<p class="muted">No exact matching products found for this selection.</p>';return}results.innerHTML=a.map(p=>'<div class="card"><div>'+(p.images?.[0]?'<img src="'+esc(p.images[0])+'" referrerpolicy="no-referrer">':'')+'</div><div><div class="muted">'+esc(p.sku)+' | '+esc(p.manufacturer||brand)+'</div><h3 style="margin:5px 0">'+esc(p.title)+'</h3>'+(articleType===1?'<span class="pill">'+esc(categoryOf(p.title))+'</span>':'')+'</div><div><div class="muted">Supplier cost</div><div class="price">'+(p.costExVat!=null?'€'+Number(p.costExVat).toFixed(2):'—')+'</div></div><div><div class="muted">Stock</div><div class="price">'+esc(p.stock??0)+'</div></div></div>').join('')}if(TOKEN){auth.classList.add('hidden');renderBrands()}else renderBrands()</script></body></html>
