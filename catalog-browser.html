<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parts Browser</title><style>*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#f5f7fb;color:#172033}.top{padding:16px 22px;background:#111827;color:white;font-size:20px;font-weight:700}.browserbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:16px 22px;display:grid;grid-template-columns:220px 260px minmax(420px,1fr);gap:18px;align-items:start}.group{margin:0}.group h3{margin:0 0 8px;font-size:14px}.brand,.model,.cat,.typebtn{border:0;background:none;padding:8px 9px;border-radius:7px;cursor:pointer}.brand:hover,.model:hover,.cat:hover,.typebtn:hover,.active{background:#eaf2ff;color:#175cd3}.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}.typebtn{border:1px solid #e5e7eb;background:#fff;text-align:center;padding:11px;width:100%}.typebtn.active{background:#2563eb;color:#fff}.brandgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px}.brand{display:block;width:100%;text-align:left}.modelwrap{display:grid;grid-template-columns:260px 1fr;gap:12px}.select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px;margin:0}.modelgrid{display:grid;grid-template-columns:repeat(4,minmax(145px,1fr));gap:3px 8px;max-height:210px;overflow:auto}.model{display:block;width:100%;text-align:left;white-space:nowrap}.content{padding:22px}.cats{display:flex;gap:10px;overflow:auto;padding:4px 0 12px}.cat{min-width:150px;background:#fff;border:1px solid #e5e7eb;text-align:center;padding:14px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}.toolbar input{flex:1;min-width:260px;padding:10px;border:1px solid #d0d5dd;border-radius:8px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:10px;display:grid;grid-template-columns:90px 1fr 130px 110px;gap:14px;align-items:center}.card img{width:80px;height:80px;object-fit:contain}.muted{color:#667085}.price{font-size:18px;font-weight:700}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#ecfdf3;color:#067647}.auth{position:fixed;inset:0;background:rgba(17,24,39,.75);display:flex;align-items:center;justify-content:center}.authbox{background:white;padding:24px;border-radius:14px;width:min(420px,90vw)}.authbox input{width:100%;padding:12px;margin:10px 0;border:1px solid #d0d5dd;border-radius:8px}.authbox button,.primary{background:#2563eb;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}.hidden{display:none}@media(max-width:1100px){.browserbar{grid-template-columns:1fr 1fr}.browserbar .group:last-child{grid-column:1/-1}.modelgrid{grid-template-columns:repeat(3,minmax(140px,1fr))}}@media(max-width:760px){.browserbar{grid-template-columns:1fr}.browserbar .group:last-child{grid-column:auto}.modelwrap{grid-template-columns:1fr}.modelgrid{grid-template-columns:repeat(2,minmax(130px,1fr));max-height:none}.card{grid-template-columns:70px 1fr}.card>div:nth-child(n+3){grid-column:2}.content{padding:12px}}</style></head><body><div class="top">ThePhoneSearch Parts Browser</div><div class="browserbar"><div class="group"><h3>Article type</h3><div class="types"><button id="type1" class="typebtn active" onclick="changeType(1)">Parts</button><button id="type2" class="typebtn" onclick="changeType(2)">Accessories</button><button id="type3" class="typebtn" onclick="changeType(3)">Tools</button><button id="type4" class="typebtn" onclick="changeType(4)">Devices</button></div></div><div class="group"><h3>Brand</h3><div id="brands" class="brandgrid"></div></div><div class="group"><h3>Model</h3><div class="modelwrap"><input id="model" class="select" placeholder="e.g. iPhone 17 Pro Max" onkeydown="if(event.key==='Enter')runSearch()"><div id="models" class="modelgrid"></div></div></div></div><main class="content"><h2 id="heading">Choose a brand and model</h2><div class="cats" id="cats"></div><div class="toolbar"><input id="q" placeholder="Search within this selection" onkeydown="if(event.key==='Enter')runSearch()"><button class="primary" onclick="runSearch()">Search</button><span id="count" class="muted"></span></div><div id="results"></div></main><div id="auth" class="auth"><div class="authbox"><h2>Unlock Parts Browser</h2><input id="tok" type="password" placeholder="ADMIN_TOKEN"><button onclick="login()">Unlock</button><div id="err" style="color:#b42318;margin-top:10px"></div></div></div><script>const BRANDS=['Apple','Google','Honor','Huawei','Motorola','Nokia','OnePlus','OPPO','Realme','Samsung','Sony','Xiaomi'];const APPLE=['iPhone 17 Pro Max','iPhone 17 Pro','iPhone 17e','iPhone Air','iPhone 17','iPhone 16 Pro Max','iPhone 16 Pro','iPhone 16 Plus','iPhone 16e','iPhone 16','iPhone 15 Pro Max','iPhone 15 Pro','iPhone 15 Plus','iPhone 15','iPhone 14 Pro Max','iPhone 14 Pro','iPhone 14 Plus','iPhone 14','iPhone 13 Pro Max','iPhone 13 Pro','iPhone 13 mini','iPhone 13','iPhone 12 Pro Max','iPhone 12 Pro','iPhone 12 mini','iPhone 12','iPhone SE (3rd generation)','iPhone SE (2nd generation)','iPhone 11 Pro Max','iPhone 11 Pro','iPhone 11','iPhone XS Max','iPhone XS','iPhone XR','iPhone X','iPhone 8 Plus','iPhone 8','iPhone 7 Plus','iPhone 7','iPhone SE','iPhone 6S Plus','iPhone 6S','iPhone 6 Plus','iPhone 6','iPhone 5s','iPhone 5C','iPhone 5','iPhone 4'];const CATS=[['Display',['display','lcd','screen','oled']],['Battery',['battery','akku']],['Flex cable',['flex']],['Housing / case',['housing','case','back cover','back glass','frame']],['Dock connector',['dock','charging','connector']],['Camera',['camera']],['Audio (speaker / mic)',['speaker','microphone','earpiece','audio']],['Antenna',['antenna']],['Adhesive tape',['adhesive','tape','sticker']]];let TOKEN=sessionStorage.getItem('tps_admin_token')||'',brand='',all=[],articleType=1;function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}async function req(u){let r=await fetch(u,{headers:{'x-admin-token':TOKEN}}),t=await r.text(),d;try{d=JSON.parse(t)}catch{d={error:t}}if(r.status===401)throw Error('Unauthorized');if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d}async function login(){TOKEN=tok.value.trim();try{await req('/api/status');sessionStorage.setItem('tps_admin_token',TOKEN);auth.classList.add('hidden');renderBrands()}catch(e){err.textContent='Incorrect ADMIN_TOKEN'}}function changeType(n){articleType=n;for(let i=1;i<=4;i++)document.getElementById('type'+i).classList.toggle('active',i===n);all=[];cats.innerHTML='';results.innerHTML='';count.textContent='';q.value='';if(n!==1){brand='';model.value='';renderBrands();heading.textContent=['','Parts','Accessories','Tools','Devices'][n];}else{heading.textContent=brand||'Choose a brand and model';renderBrands();}runSearch()}function renderBrands(){brands.innerHTML=BRANDS.map(b=>'<button class="brand '+(b===brand?'active':'')+'" onclick="chooseBrand(\''+b.replace(/'/g,"\\'")+'\')">'+b+'</button>').join('');renderModels()}function chooseBrand(b){brand=b;model.value='';renderBrands();heading.textContent=b+(articleType===1?' parts':'');runSearch()}function renderModels(){models.innerHTML=(articleType===1&&brand==='Apple'?APPLE:[]).map(m=>'<button class="model" onclick="chooseModel(\''+m.replace(/'/g,"\\'")+'\')">'+m+'</button>').join('')}function chooseModel(m){articleType=1;for(let i=1;i<=4;i++)document.getElementById('type'+i).classList.toggle('active',i===1);model.value=m;heading.textContent=(brand?brand+' → ':'')+m;runSearch()}function categoryOf(title){let s=(title||'').toLowerCase();for(const [name,keys] of CATS)if(keys.some(k=>s.includes(k)))return name;return'Other parts'}function renderCats(){if(articleType!==1){cats.innerHTML='';return}let names=[...new Set(all.map(x=>categoryOf(x.title)))];cats.innerHTML=names.map(n=>'<button class="cat" onclick="filterCat(\''+n.replace(/'/g,"\\'")+'\')">'+esc(n)+'</button>').join('')}function filterCat(n){renderResults(all.filter(x=>categoryOf(x.title)===n));heading.textContent=(model.value||brand||'Products')+' — '+n}async function runSearch(){let mdl=model.value.trim();let terms;if(articleType===1)terms=[brand,mdl,q.value.trim()].filter(Boolean).join(' ').trim();else terms=q.value.trim()||brand;if(!terms){results.innerHTML='<p class="muted">'+(articleType===1?'Choose a brand or enter a model.':'Enter a search term or choose a brand.')+'</p>';return}results.innerHTML='Loading MobileParts products…';try{let d=await req('/api/catalog?q='+encodeURIComponent(terms)+'&articleType='+articleType+'&pageSize=100');let items=d.items||[];if(articleType===1&&mdl){const target=norm(mdl);items=items.filter(x=>norm(x.title).includes(target));}all=items;count.textContent=all.length+' exact matching articles';heading.textContent=articleType===1?([brand,mdl].filter(Boolean).join(' → ')||terms):(['','Parts','Accessories','Tools','Devices'][articleType]+(terms?' — '+terms:''));renderCats();renderResults(all)}catch(e){results.innerHTML='<p style="color:#b42318">'+esc(e.message)+'</p>'}}function renderResults(a){if(!a.length){results.innerHTML='<p class="muted">No exact matching products found for this selection.</p>';return}results.innerHTML=a.map(p=>'<div class="card"><div>'+(p.images?.[0]?'<img src="'+esc(p.images[0])+'" referrerpolicy="no-referrer">':'')+'</div><div><div class="muted">'+esc(p.sku)+' | '+esc(p.manufacturer||brand)+'</div><h3 style="margin:5px 0">'+esc(p.title)+'</h3>'+(articleType===1?'<span class="pill">'+esc(categoryOf(p.title))+'</span>':'')+'</div><div><div class="muted">Supplier cost</div><div class="price">'+(p.costExVat!=null?'€'+Number(p.costExVat).toFixed(2):'—')+'</div></div><div><div class="muted">Stock</div><div class="price">'+esc(p.stock??0)+'</div></div></div>').join('')}if(TOKEN){auth.classList.add('hidden');renderBrands()}else renderBrands()</script></body></html>
