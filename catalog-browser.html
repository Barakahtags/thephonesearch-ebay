<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parts Browser</title><style>*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#f5f7fb;color:#172033}.top{padding:16px 22px;background:#111827;color:white;font-size:20px;font-weight:700}.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 56px)}aside{background:#fff;border-right:1px solid #e5e7eb;padding:18px;position:sticky;top:0;height:100vh;overflow:auto}main{padding:22px}.group{margin-bottom:18px}.group h3{margin:0 0 8px;font-size:14px}.brand,.model,.cat{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 6px;border-radius:7px;cursor:pointer}.brand:hover,.model:hover,.cat:hover,.active{background:#eaf2ff;color:#175cd3}.select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px;margin-bottom:10px}.cats{display:flex;gap:10px;overflow:auto;padding:4px 0 12px}.cat{min-width:150px;background:#fff;border:1px solid #e5e7eb;text-align:center;padding:14px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}.toolbar input{flex:1;min-width:260px;padding:10px;border:1px solid #d0d5dd;border-radius:8px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-bottom:10px;display:grid;grid-template-columns:90px 1fr 130px 110px;gap:14px;align-items:center}.card img{width:80px;height:80px;object-fit:contain}.muted{color:#667085}.price{font-size:18px;font-weight:700}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#ecfdf3;color:#067647}.auth{position:fixed;inset:0;background:rgba(17,24,39,.75);display:flex;align-items:center;justify-content:center}.authbox{background:white;padding:24px;border-radius:14px;width:min(420px,90vw)}.authbox input{width:100%;padding:12px;margin:10px 0;border:1px solid #d0d5dd;border-radius:8px}.authbox button,.primary{background:#2563eb;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}.hidden{display:none}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{position:relative;height:auto}.card{grid-template-columns:70px 1fr}.card>div:nth-child(n+3){grid-column:2}}</style></head><body><div class="top">ThePhoneSearch Parts Browser</div><div class="layout"><aside><div class="group"><h3>Article type</h3><select id="atype" class="select" onchange="runSearch()"><option value="1">Parts</option><option value="2">Accessories</option><option value="3">Tools</option><option value="4">Devices</option></select></div><div class="group"><h3>Brand</h3><div id="brands"></div></div><div class="group"><h3>Model</h3><input id="model" class="select" placeholder="e.g. iPhone 17 Pro Max" onkeydown="if(event.key==='Enter')runSearch()"><div id="models"></div></div></aside><main><h2 id="heading">Choose a brand and model</h2><div class="cats" id="cats"></div><div class="toolbar"><input id="q" placeholder="Search within this model" onkeydown="if(event.key==='Enter')runSearch()"><button class="primary" onclick="runSearch()">Search</button><span id="count" class="muted"></span></div><div id="results"></div></main></div><div id="auth" class="auth"><div class="authbox"><h2>Unlock Parts Browser</h2><input id="tok" type="password" placeholder="ADMIN_TOKEN"><button onclick="login()">Unlock</button><div id="err" style="color:#b42318;margin-top:10px"></div></div></div><script>const BRANDS=['Apple','Google','Honor','Huawei','Motorola','Nokia','OnePlus','OPPO','Realme','Samsung','Sony','Xiaomi'];const APPLE=['iPhone 17 Pro Max','iPhone 17 Pro','iPhone 17e','iPhone Air','iPhone 17','iPhone 16 Pro Max','iPhone 16 Pro','iPhone 16 Plus','iPhone 16e','iPhone 16','iPhone 15 Pro Max','iPhone 15 Pro','iPhone 15 Plus','iPhone 15','iPhone 14 Pro Max','iPhone 14 Pro','iPhone 14 Plus','iPhone 14','iPhone 13 Pro Max','iPhone 13 Pro','iPhone 13 mini','iPhone 13','iPhone 12 Pro Max','iPhone 12 Pro','iPhone 12 mini','iPhone 12','iPhone SE (3rd generation)','iPhone SE (2nd generation)','iPhone 11 Pro Max','iPhone 11 Pro','iPhone 11','iPhone XS Max','iPhone XS','iPhone XR','iPhone X','iPhone 8 Plus','iPhone 8','iPhone 7 Plus','iPhone 7','iPhone SE','iPhone 6S Plus','iPhone 6S','iPhone 6 Plus','iPhone 6','iPhone 5s','iPhone 5C','iPhone 5','iPhone 4'];const CATS=[['Display',['display','lcd','screen','oled']],['Battery',['battery','akku']],['Flex cable',['flex']],['Housing / case',['housing','case','back cover','back glass']],['Dock connector',['dock','charging','connector','usb']],['Camera',['camera']],['Audio (speaker / mic)',['speaker','microphone','earpiece','audio']],['Antenna',['antenna']],['Adhesive tape',['adhesive','tape','sticker']]];let TOKEN=sessionStorage.getItem('tps_admin_token')||'',brand='',all=[];function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function req(u){let r=await fetch(u,{headers:{'x-admin-token':TOKEN}}),t=await r.text(),d;try{d=JSON.parse(t)}catch{d={error:t}}if(r.status===401)throw Error('Unauthorized');if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d}async function login(){TOKEN=tok.value.trim();try{await req('/api/status');sessionStorage.setItem('tps_admin_token',TOKEN);auth.classList.add('hidden');renderBrands()}catch(e){err.textContent='Incorrect ADMIN_TOKEN'}}function renderBrands(){brands.innerHTML=BRANDS.map(b=>'<button class="brand '+(b===brand?'active':'')+'" onclick="chooseBrand(\''+b.replace(/'/g,"\\'")+'\')">'+b+'</button>').join('');renderModels()}function chooseBrand(b){brand=b;model.value='';renderBrands();heading.textContent=b+' parts';runSearch()}function renderModels(){models.innerHTML=(brand==='Apple'?APPLE:[]).map(m=>'<button class="model" onclick="chooseModel(\''+m.replace(/'/g,"\\'")+'\')">'+m+'</button>').join('')}function chooseModel(m){model.value=m;heading.textContent=(brand?brand+' → ':'')+m;runSearch()}function categoryOf(title){let s=(title||'').toLowerCase();for(const [name,keys] of CATS)if(keys.some(k=>s.includes(k)))return name;return 'Other parts'}function renderCats(){let names=[...new Set(all.map(x=>categoryOf(x.title)))];cats.innerHTML=names.map(n=>'<button class="cat" onclick="filterCat(\''+n.replace(/'/g,"\\'")+'\')">'+esc(n)+'</button>').join('')}function filterCat(n){renderResults(all.filter(x=>categoryOf(x.title)===n));heading.textContent=(model.value||brand||'Products')+' — '+n}async function runSearch(){let terms=[brand,model.value.trim(),q.value.trim()].filter(Boolean).join(' ').trim();if(!terms){results.innerHTML='<p class="muted">Choose a brand or enter a model.</p>';return}results.innerHTML='Loading MobileParts products…';try{let d=await req('/api/catalog?q='+encodeURIComponent(terms)+'&articleType='+atype.value+'&pageSize=100');all=d.items||[];count.textContent=(d.total??all.length)+' matching articles';heading.textContent=terms;renderCats();renderResults(all)}catch(e){results.innerHTML='<p style="color:#b42318">'+esc(e.message)+'</p>'}}function renderResults(a){if(!a.length){results.innerHTML='<p class="muted">No matching products found.</p>';return}results.innerHTML=a.map(p=>'<div class="card"><div>'+(p.images?.[0]?'<img src="'+esc(p.images[0])+'" referrerpolicy="no-referrer">':'')+'</div><div><div class="muted">'+esc(p.sku)+' | '+esc(p.manufacturer||brand)+'</div><h3 style="margin:5px 0">'+esc(p.title)+'</h3><span class="pill">'+esc(categoryOf(p.title))+'</span></div><div><div class="muted">Supplier cost</div><div class="price">'+(p.costExVat!=null?'€'+Number(p.costExVat).toFixed(2):'—')+'</div></div><div><div class="muted">Stock</div><div class="price">'+esc(p.stock??0)+'</div></div></div>').join('')}if(TOKEN){auth.classList.add('hidden');renderBrands()}else renderBrands()</script></body></html>
