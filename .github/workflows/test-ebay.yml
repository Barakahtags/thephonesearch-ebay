name: Production smoke tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deployment
        run: sleep 30
      - name: Test public dashboard pages
        run: |
          set -e
          BASE="https://ie-verified-phones-ebay-hook.vercel.app"
          code=$(curl -sS -o dashboard.html -w "%{http_code}" "$BASE/dashboard.html")
          test "$code" = "200"
          grep -q 'MobileParts.shop' dashboard.html

          code=$(curl -sS -o app.html -w "%{http_code}" "$BASE/app.html")
          test "$code" = "200"
          grep -q 'Only currently in-stock MobileParts products are shown here' app.html
          grep -q 'Money in and money out' app.html

      - name: Confirm protected routes are compiled and locked
        run: |
          set -e
          BASE="https://ie-verified-phones-ebay-hook.vercel.app"
          for path in /api/status /api/catalog /api/sync-preview /api/orders-preview '/api/sync?action=stock-delta'; do
            code=$(curl -sS -o body.json -w "%{http_code}" "$BASE$path")
            echo "$path -> $code"
            cat body.json
            test "$code" = "401"
          done
