name: Production smoke tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test listing and live-write safety
        run: |
          node --test test/*.test.js
          find api cloudflare/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Wait for Vercel deployment
        run: sleep 30
      - name: Test public dashboard pages
        run: |
          set -e
          BASE="https://ie-verified-phones-ebay-hook.vercel.app"
          code=$(curl -sS -o dashboard.html -w "%{http_code}" "$BASE/dashboard.html")
          test "$code" = "200"
          grep -q 'MobileParts.shop' dashboard.html

          code=$(curl -sS -o app.html -w "%{http_code}" "$BASE/app.html")
          test "$code" = "200"
          grep -q 'Only currently in-stock MobileParts products are shown' app.html
          grep -q 'Money in and money out' app.html

          code=$(curl -sS -o orders-manager.html -w "%{http_code}" "$BASE/orders-manager.html")
          test "$code" = "200"
          grep -q '/api/orders-preview' orders-manager.html
          ! grep -q '/api/orders-prepare' orders-manager.html

      - name: Confirm protected routes are compiled and locked
        run: |
          set -e
          BASE="https://ie-verified-phones-ebay-hook.vercel.app"
          for path in /api/status /api/catalog /api/sync-preview /api/orders-preview '/api/sync?action=stock-delta'; do
            code=$(curl -sS -o body.json -w "%{http_code}" "$BASE$path")
            echo "$path -> $code"
            cat body.json
            test "$code" = "401"
          done
