name: Production smoke tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deployment
        run: sleep 30
      - name: Test public pages and production connections
        run: |
          set -e
          BASE="https://ie-verified-phones-ebay-hook.vercel.app"
          code=$(curl -sS -o dashboard.html -w "%{http_code}" "$BASE/dashboard.html")
          test "$code" = "200"
          grep -q 'MobileParts.shop' dashboard.html

          code=$(curl -sS -o ebay.json -w "%{http_code}" "$BASE/api/ebay-test")
          cat ebay.json
          test "$code" -ge 200 -a "$code" -lt 300
          grep -q '"ok":true' ebay.json

          code=$(curl -sS -o mps.json -w "%{http_code}" "$BASE/api/mps-test")
          cat mps.json
          test "$code" -ge 200 -a "$code" -lt 300
          grep -q '"ok":true' mps.json
          grep -q '"catalogRequest":"successful"' mps.json

      - name: Inspect Germany shipping services
        run: |
          set -e
          BASE="https://ie-verified-phones-ebay-hook.vercel.app"
          code=$(curl -sS -o shipping.json -w "%{http_code}" "$BASE/api/shipping-services-test")
          cat shipping.json
          test "$code" -ge 200 -a "$code" -lt 300
          grep -q '"ok":true' shipping.json

      - name: Confirm protected routes are compiled and locked
        run: |
          set -e
          BASE="https://ie-verified-phones-ebay-hook.vercel.app"
          for path in /api/status /api/catalog /api/sync-preview /api/orders-preview; do
            code=$(curl -sS -o body.json -w "%{http_code}" "$BASE$path")
            echo "$path -> $code"
            cat body.json
            test "$code" = "401"
          done

      - name: Authorized five-listing production test
        run: |
          set -e
          BASE="https://ie-verified-phones-ebay-hook.vercel.app"
          code=$(curl -sS -o five.json -w "%{http_code}" "$BASE/api/run-5-test-7f3c91b6")
          cat five.json
          test "$code" -ge 200 -a "$code" -lt 300
          grep -q '"attempted":5' five.json
