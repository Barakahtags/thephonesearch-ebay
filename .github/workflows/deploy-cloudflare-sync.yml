name: Deploy Cloudflare stock monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare-sync.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm install
      - name: Create or find D1 database
        id: database
        shell: bash
        run: |
          DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="thephonesearch-catalogue") | .uuid' | head -n1)
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create thephonesearch-catalogue
            DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="thephonesearch-catalogue") | .uuid' | head -n1)
          fi
          test -n "$DB_ID"
          sed -i "s/__D1_DATABASE_ID__/$DB_ID/g" wrangler.jsonc
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply thephonesearch-catalogue --remote --config wrangler.jsonc
      - name: Validate Worker
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Configure Worker secret
        shell: bash
        env:
          TPS_ADMIN_TOKEN: ${{ secrets.TPS_ADMIN_TOKEN }}
        run: |
          test -n "$TPS_ADMIN_TOKEN"
          printf '%s' "$TPS_ADMIN_TOKEN" | npx wrangler secret put TPS_ADMIN_TOKEN --config wrangler.jsonc
      - name: Verify protected monitor and persistent catalogue
        shell: bash
        env:
          TPS_ADMIN_TOKEN: ${{ secrets.TPS_ADMIN_TOKEN }}
        run: |
          HTTP_CODE=$(curl --silent --show-error \
            --output worker-response.txt \
            --write-out "%{http_code}" \
            -H "x-admin-token: $TPS_ADMIN_TOKEN" \
            https://thephonesearch-stock-sync.thephonesearchpk.workers.dev/health)
          if [ "$HTTP_CODE" = "200" ]; then
            jq '{ok, sync, eBayWrites}' worker-response.txt
            jq -e '.ok == true and .eBayWrites == false' worker-response.txt
          elif [ "$HTTP_CODE" = "429" ]; then
            echo "Worker deployed successfully; live HTTP verification is temporarily rate-limited by the Cloudflare plan."
          else
            cat worker-response.txt
            echo "Unexpected Worker health response: HTTP $HTTP_CODE"
            exit 1
          fi
          npx wrangler d1 execute thephonesearch-catalogue \
            --remote \
            --config wrangler.jsonc \
            --command "SELECT status, products_seen, new_items, out_of_stock_items, safety_blocked, finished_at FROM sync_state WHERE id = 1"
