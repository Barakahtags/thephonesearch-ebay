<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThePhoneSearch Orders</title><style>:root{--bg:#070b14;--p:#0d1422;--l:#1f2b3d;--t:#f4f7fb;--m:#8ea0b8;--b:#4f8cff;--g:#38d996;--r:#ff6b78;--a:#f7b955}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px Inter,Segoe UI,Arial,sans-serif}main{width:min(96vw,2200px);margin:auto;padding:34px}h1{font-size:36px;margin:0 0 8px}.muted{color:var(--m)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.card,.order{background:var(--p);border:1px solid var(--l);border-radius:15px;padding:20px}.v{font-size:28px;font-weight:800;margin-top:8px}.good{color:var(--g)}.bad{color:var(--r)}.warn{color:var(--a)}button{background:var(--b);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:750;cursor:pointer}.locked{background:#252b36;color:#9aa8ba;cursor:not-allowed}.order{margin:12px 0}.head{display:flex;justify-content:space-between;gap:20px;align-items:center}.line{display:grid;grid-template-columns:1.5fr .7fr .7fr .7fr;gap:10px;padding:12px 0;border-top:1px solid var(--l)}.pill{padding:5px 9px;border-radius:999px;background:#12231d;color:var(--g);font-size:12px}.problem{background:#2a171b;color:#ff9aa5}.notice{border:1px solid #58451f;background:#211b0d;color:#ffd486;padding:14px;border-radius:10px;margin:16px 0}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.line{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}}</style></head><body><main><div class="muted">THEPHONESEARCH · ORDER CONTROL</div><h1>MobileParts Order Preparation</h1><p class="muted">Paid eBay orders are matched to MobileParts. Supplier purchasing remains locked.</p><div class="notice">SAFE MODE: This screen cannot place or pay for MobileParts orders.</div><div class="cards"><div class="card">eBay orders<div id="total" class="v">—</div></div><div class="card">Ready<div id="ready" class="v good">—</div></div><div class="card">Need review<div id="review" class="v warn">—</div></div><div class="card">Supplier purchase<div class="v">LOCKED</div></div></div><button onclick="load()">Refresh orders</button> <button class="locked" disabled>Place MobileParts Orders — Locked</button><div id="list" style="margin-top:20px">Loading…</div></main><script>const token=sessionStorage.getItem('tps_admin_token')||'';const e=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){list.textContent='Loading and matching orders…';try{let r=await fetch('/api/orders-prepare',{headers:{'x-admin-token':token}}),x=await r.json();if(!r.ok)throw Error(x.error||r.statusText);total.textContent=x.total;ready.textContent=x.ready;review.textContent=x.total-x.ready;if(!x.orders.length){list.innerHTML='<div class="order"><b>No eBay orders returned right now.</b></div>';return}list.innerHTML=x.orders.map(o=>'<section class="order"><div class="head"><div><b>eBay '+e(o.ebayOrderId)+'</b><div class="muted">'+e(o.buyer||'Buyer')+' · '+e(o.paymentStatus)+' · '+e(o.fulfillmentStatus)+'</div></div><span class="pill '+(o.ready?'':'problem')+'">'+(o.ready?'READY':'REVIEW')+'</span></div><p class="muted">Ship to: '+e([o.shipTo.name,o.shipTo.addressLine1,o.shipTo.postalCode,o.shipTo.city,o.shipTo.country].filter(Boolean).join(', '))+'</p>'+o.lines.map(l=>'<div class="line"><div><b>'+e(l.title)+'</b><br><span class="muted">eBay SKU: '+e(l.sku)+'</span></div><div>Qty <b>'+e(l.quantity)+'</b></div><div>'+(l.mobileParts?'MPS '+e(l.mobileParts.partNumber)+'<br><span class="muted">Stock '+e(l.mobileParts.stock)+'</span>':'<span class="bad">No MPS match</span>')+'</div><div><span class="pill '+(l.ready?'':'problem')+'">'+(l.ready?'MATCHED':'CHECK')+'</span></div></div>').join('')+'</section>').join('')}catch(err){list.innerHTML='<div class="order bad">'+e(err.message)+'</div>'}}load()</script></body></html>
